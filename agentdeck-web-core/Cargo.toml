[package]
name = "agentdeck-web-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral Rust/WASM contract core for the Relay Web Test Companion"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
w1-test-fixture = ["dep:url"]
w2-test-fixture = []

[dependencies]
agentdeck-crypto = { path = "../agentdeck-crypto" }
agentdeck-protocol = { path = "../agentdeck-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 只在 browser WASM consumer 中统一打开 JS entropy backend；native protocol/crypto
# 依赖图和其他 WASM consumer 不受影响。
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"

[dev-dependencies]
base64 = "0.22"
