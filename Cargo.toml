[workspace]
members = [
    "agentdeckd",
    "agentdeck-protocol",
    "agentdeck-cli",
    "agentdeck-desktop",
    "third_party/xim-ctext",
]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/Jassy930/AgentDeck"

# 本地开发与测试由 sccache 复用编译结果，因此关闭 Cargo incremental，避免
# 每个 Git worktree 的 target/debug/incremental 独立增长。项目代码保留行表级
# 调试信息，依赖不生成调试信息；项目代码需要完整调试时可临时用环境变量覆盖。
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

# gpui 0.2.2 的 X11 输入法依赖 zed-xim → xim-ctext 0.3，0.3 解不了中文 COMPOUND_TEXT，
# zed-xim 对解码结果 expect，Linux X11 + ibus 输入中文时直接 panic（issue #52）。
# 上游 gpui 升级到修复版本后可删除此补丁与 third_party/xim-ctext。
[patch.crates-io]
xim-ctext = { path = "third_party/xim-ctext" }
