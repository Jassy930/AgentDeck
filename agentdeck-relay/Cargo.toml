[package]
name = "agentdeck-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentDeck self-hostable relay — R0 in-memory fake relay + stdio machine bridge (no network)"

[dependencies]
agentdeck-protocol = { path = "../agentdeck-protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }

[features]
default = []
server = ["dep:axum", "dep:futures-util", "dep:tracing", "dep:tracing-subscriber", "tokio/net", "tokio/rt-multi-thread"]
tls = ["server", "dep:rustls", "dep:tokio-rustls"]

[[bin]]
name = "agentdeck-relay"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
# R1a Task 10 e2e（tests/r1a_ws_e2e.rs，`#[cfg(feature = "server")]`）：真 loopback
# WS 客户端 + 阻塞 REST enroll 客户端。ed25519-dalek/base64/serde_json/rand 已在
# `[dependencies]`（对 `tests/*.rs` 同样可见），无需在此重复声明；
# tracing-subscriber 是 `[dependencies]` 里的 optional dep，`--features server`
# 编译本测试文件时已随 feature 一并可见，同理无需重复声明。
agentdeck-relay-client = { path = "../agentdeck-relay-client" }
ureq = { version = "2", features = ["json"] }
