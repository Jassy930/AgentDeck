name: Release packages

# PR 和手动运行只产出 Actions artifacts；仅 v* tag 可进入统一发布门禁。
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/offline-ci.yml

  build:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            kind: desktop
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            kind: desktop
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            kind: desktop
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            kind: desktop
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            kind: desktop
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            kind: daemon
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            kind: daemon
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      AGENTDECK_RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure native MSVC x64 tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Locate Windows SDK shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'The Windows SDK fxc.exe shader compiler is missing.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$env:ProgramFiles/LLVM/bin" >> $env:GITHUB_ENV
          Get-Command cl.exe, link.exe, dumpbin.exe, cmake.exe

      # 只缓存依赖，显式区分OS/架构/runner/目标/部署基线；tag完全不用PR缓存。
      - name: Cache non-publishing Rust dependencies
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ matrix.target }}-macos15
          workspaces: ". -> target/release-build"
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH LIBCLANG_PATH"
          cache-bin: false
          cache-workspace-crates: false
          # 保留失败 PR 中已编译的依赖；tag 任务仍完全禁用该缓存步骤。
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && matrix.kind == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-xcb-dev libxcb1-dev libxkbcommon-x11-dev libwayland-dev \
            libssl-dev libasound2-dev libvulkan1 mesa-vulkan-drivers \
            xvfb xauth dbus-x11 fonts-dejavu-core zip unzip

      - name: Install musl toolchain
        if: matrix.kind == 'daemon'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools zip unzip

      - name: Verify workspace and release tag versions
        if: runner.os != 'Windows'
        env:
          RELEASE_REF: ${{ github.ref_name }}
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ "$IS_TAG" == true ]]; then
            scripts/release/check-version.sh "$RELEASE_REF"
          else
            scripts/release/check-version.sh
          fi

      - name: Test release packaging scripts
        if: runner.os != 'Windows'
        run: |
          for script in scripts/release/*.sh; do bash -n "$script"; done
          scripts/release/test.sh
          scripts/release/test-verify-set.sh

      - name: Test native Windows packaging scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/test-windows.ps1

      - name: Build release archives
        if: runner.os != 'Windows'
        run: scripts/release/package.sh '${{ matrix.target }}' '${{ matrix.kind }}' dist/release

      - name: Build native Windows release archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/package-windows.ps1 -OutputDir dist/release

      - name: Run target unit tests without vendor sessions
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE_KIND: ${{ matrix.kind }}
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/home" "$test_root/bin"
          for vendor in codex claude; do
            printf '#!/bin/sh\necho vendor-executed >> "%s"\nexit 97\n' "$test_root/marker" > "$test_root/bin/$vendor"
            chmod +x "$test_root/bin/$vendor"
          done
          package=agentdeckd
          test_targets=(--lib --bins)
          if [[ "$PACKAGE_KIND" == desktop ]]; then
            package=agentdeck-desktop
            test_targets=(--bins)
          fi
          env HOME="$test_root/home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            PATH="$test_root/bin:$PATH" AGENTDECK_E2E=0 AGENTDECK_CODEX_BIN="$test_root/bin/codex" \
            cargo test --release --locked --target "$TARGET" --target-dir target/release-build \
            -p "$package" "${test_targets[@]}"
          test ! -e "$test_root/marker"

      - name: Run Windows tests with native process and IPC fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'agentdeck-windows-tests'
          New-Item -ItemType Directory -Force "$testRoot/home", "$testRoot/bin", "$testRoot/appdata", "$testRoot/localappdata" | Out-Null
          $env:CARGO_HOME = Join-Path $env:USERPROFILE '.cargo'
          $env:RUSTUP_HOME = Join-Path $env:USERPROFILE '.rustup'
          $env:HOME = "$testRoot/home"
          $env:USERPROFILE = "$testRoot/home"
          $env:APPDATA = "$testRoot/appdata"
          $env:LOCALAPPDATA = "$testRoot/localappdata"
          $env:AGENTDECK_DATA_DIR = "$testRoot/data"
          $env:AGENTDECK_OFFLINE_MARKER = "$testRoot/vendor-invoked"
          $env:AGENTDECK_E2E = '0'
          'fn main() { std::fs::write(std::env::var("AGENTDECK_OFFLINE_MARKER").unwrap(), b"vendor invoked").unwrap(); std::process::exit(97); }' |
            Set-Content -Encoding utf8 "$testRoot/tripwire.rs"
          rustc "$testRoot/tripwire.rs" -o "$testRoot/bin/codex.exe"
          if ($LASTEXITCODE) { throw 'Vendor tripwire compilation failed.' }
          Copy-Item "$testRoot/bin/codex.exe" "$testRoot/bin/claude.exe"
          $env:PATH = "$testRoot/bin;$env:PATH"
          $env:AGENTDECK_CODEX_BIN = "$testRoot/bin/codex.exe"
          $env:AGENTDECK_DAEMON_BIN = "$env:GITHUB_WORKSPACE/target/release-build/x86_64-pc-windows-msvc/release/agentdeckd.exe"
          cargo test --release --locked --target x86_64-pc-windows-msvc --target-dir target/release-build -p agentdeckd --lib --bins
          if ($LASTEXITCODE) { throw 'Windows daemon tests failed.' }
          cargo test --release --locked --target x86_64-pc-windows-msvc --target-dir target/release-build -p agentdeck-desktop --tests
          if ($LASTEXITCODE) { throw 'Windows desktop tests failed.' }
          cargo test --release --locked --target x86_64-pc-windows-msvc --target-dir target/release-build -p agentdeck-cli --tests
          if ($LASTEXITCODE) { throw 'Windows CLI transport tests failed.' }
          $cli = "$env:GITHUB_WORKSPACE/target/release-build/x86_64-pc-windows-msvc/release/agentdeck.exe"
          $selfcheck = & $cli --data-dir "$testRoot/data" selfcheck | ConvertFrom-Json
          if ($LASTEXITCODE -or $selfcheck.ok -ne $true) { throw 'Windows CLI/current daemon IPC selfcheck failed.' }
          $schema = (& $cli --data-dir "$testRoot/data" protocol schema) -join "`n"
          if ($LASTEXITCODE) { throw 'Windows protocol schema request failed.' }
          $expected = (Get-Content -Raw protocol/agentdeck/agentdeck-protocol.schema.json).Replace("`r`n", "`n").Trim()
          if ($schema.Trim() -cne $expected) { throw 'Windows protocol schema differs from the committed snapshot.' }
          & $cli --data-dir "$testRoot/data" diagnostics report
          if ($LASTEXITCODE) { throw 'Windows diagnostics report failed.' }
          if (Test-Path $env:AGENTDECK_OFFLINE_MARKER) { throw 'A test attempted to run a real vendor CLI.' }

      - name: Smoke test Linux desktop archive under X11
        if: runner.os == 'Linux' && matrix.kind == 'desktop'
        run: |
          lavapipe=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${lavapipe[0]}"
          xvfb-run -a env -u WAYLAND_DISPLAY VK_DRIVER_FILES="${lavapipe[0]}" \
            dbus-run-session -- scripts/release/smoke.sh '${{ matrix.target }}' desktop dist/release

      - name: Smoke test packaged binaries
        if: runner.os == 'macOS' || matrix.kind == 'daemon'
        run: scripts/release/smoke.sh '${{ matrix.target }}' '${{ matrix.kind }}' dist/release

      - name: Smoke test native Windows archives
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GPUI_DISABLE_DIRECT_COMPOSITION: "1"
        run: ./scripts/release/smoke-windows.ps1 -OutputDir dist/release

      - name: Upload verified target archives
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  collect:
    name: Complete release asset set
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/release
      - name: Verify all targets and generate checksums
        run: scripts/release/verify-set.sh dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish complete release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, collect, offline]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - name: Recheck tag and complete asset set
        run: |
          scripts/release/check-version.sh "$GITHUB_REF_NAME"
          scripts/release/verify-set.sh dist/release --check
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/release/SHA256SUMS
      - name: Stage all assets, verify downloads, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' "$RUNNER_TEMP/release.json"
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          macOS 15+ Apple Silicon / Intel、Ubuntu 24.04 x86_64 / ARM64、Windows x64 桌面包与独立 daemon；保留 Linux x86_64 / ARM64 musl daemon。

          macOS 产物使用 ad-hoc 签名，未经 Apple 公证；不能视为 Developer ID 公证发行版。Windows zip 未作 Authenticode 签名，构建及烟测基线为 Windows Server 2025。Windows ARM64 不在支持范围。

          安装方法和系统依赖见本 tag 的 docs/RELEASE.md；下载后请使用 SHA256SUMS 校验，可用 gh attestation verify <归档> --repo ${{ github.repository }} 核验构建来源。
          NOTES
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --draft \
              --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" dist/release/* --clobber
          downloaded="$RUNNER_TEMP/release-download"
          mkdir -p "$downloaded"
          gh release download "$tag" --dir "$downloaded"
          scripts/release/verify-set.sh "$downloaded" --check
          cmp dist/release/SHA256SUMS "$downloaded/SHA256SUMS"
          gh release edit "$tag" --draft=false
