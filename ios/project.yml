name: AgentDeckMobile
options:
  bundleIdPrefix: dev.agentdeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AgentDeck:
    path: ..
targets:
  AgentDeckMobile:
    type: application
    platform: iOS
    sources:
      - AgentDeckMobile
      - path: Fixtures
        buildPhase: resources
        optional: true
    dependencies:
      - package: AgentDeck
        product: AgentDeckCore
      - package: AgentDeck
        product: AgentDeckSessionSource
        # RelayClient 已传递链接该 target；保留 module/build edge，二者解耦时必须恢复直接 link。
        link: false
      - package: AgentDeck
        product: AgentDeckRelayClient
    info:
      path: AgentDeckMobile/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: 扫描 AgentDeck 完整配对二维码
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
  AgentDeckMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgentDeckMobileTests
    dependencies:
      - target: AgentDeckMobile
      - package: AgentDeck
        product: AgentDeckCore
      - package: AgentDeck
        product: AgentDeckSessionSource
        # RelayClient 已传递链接该 target；保留 module/build edge，二者解耦时必须恢复直接 link。
        link: false
      - package: AgentDeck
        product: AgentDeckRelayClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AgentDeckMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AgentDeckMobileUITests
    dependencies:
      - target: AgentDeckMobile
    settings:
      base:
        AGENTDECK_RELAY_E2E_INVITE_PATH: ""
        GENERATE_INFOPLIST_FILE: YES
    postBuildScripts:
      - name: Stage private Relay E2E invite
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/RelayCompanionPairInvite.secret"
          if [ -e "$destination" ]; then
            /bin/rm "$destination"
          fi
          source_path="${AGENTDECK_RELAY_E2E_INVITE_PATH:-}"
          if [ -z "$source_path" ]; then
            exit 0
          fi
          case "$source_path" in
            /private/tmp/ar4.*/ad-p57-host-*/pair-invite.secret) ;;
            *)
              printf 'unsafe Relay E2E invite source path\n' >&2
              exit 1
              ;;
          esac
          if [ ! -f "$source_path" ] || [ -L "$source_path" ]; then
            printf 'Relay E2E invite source is not a regular file\n' >&2
            exit 1
          fi
          if [ "$(/usr/bin/stat -f '%Lp' "$source_path")" != "600" ]; then
            printf 'Relay E2E invite source mode is not 0600\n' >&2
            exit 1
          fi
          /usr/bin/install -m 600 "$source_path" "$destination"
schemes:
  AgentDeckMobile:
    build:
      targets:
        AgentDeckMobile: all
        AgentDeckMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentDeckMobileTests
      commandLineArguments:
        "--agentdeck-fixture-source": true
  RelayCompanionE2E:
    build:
      targets:
        AgentDeckMobile: all
        AgentDeckMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentDeckMobileUITests
