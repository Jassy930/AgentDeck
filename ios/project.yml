name: AgentDeckMobile
options:
  bundleIdPrefix: dev.agentdeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AgentDeck:
    path: ..
targets:
  AgentDeckMobile:
    type: application
    platform: iOS
    sources:
      - AgentDeckMobile
      - path: Fixtures
        buildPhase: resources
        optional: true
    dependencies:
      - package: AgentDeck
        product: AgentDeckCore
      - package: AgentDeck
        product: AgentDeckSessionSource
        # RelayClient 已传递链接该 target；保留 module/build edge，二者解耦时必须恢复直接 link。
        link: false
      - package: AgentDeck
        product: AgentDeckRelayClient
    info:
      path: AgentDeckMobile/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: 扫描 AgentDeck 完整配对二维码
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
  AgentDeckMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgentDeckMobileTests
    dependencies:
      - target: AgentDeckMobile
      - package: AgentDeck
        product: AgentDeckCore
      - package: AgentDeck
        product: AgentDeckSessionSource
        # RelayClient 已传递链接该 target；保留 module/build edge，二者解耦时必须恢复直接 link。
        link: false
      - package: AgentDeck
        product: AgentDeckRelayClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AgentDeckMobile:
    build:
      targets:
        AgentDeckMobile: all
        AgentDeckMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentDeckMobileTests
      commandLineArguments:
        "--agentdeck-fixture-source": true
