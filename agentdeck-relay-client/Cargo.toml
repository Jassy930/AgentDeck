[package]
name = "agentdeck-relay-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agentdeck-protocol = { path = "../agentdeck-protocol" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
serde_json = "1"
thiserror = "1"
url = "2"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
x509-parser = { version = "0.18", default-features = false }
sha2 = "0.10"
httparse = "1"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"
