[package]
name = "agentdeck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentDeck unified CLI — reference client and contract conformance / E2E driver"

[[bin]]
name = "agentdeck"
path = "src/main.rs"

[dependencies]
agentdeck-protocol = { path = "../agentdeck-protocol" }
agentdeck-relay = { path = "../agentdeck-relay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "process", "sync", "macros", "time"] }
