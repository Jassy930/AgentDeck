[package]
name = "agentdeck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentDeck unified CLI — reference client and contract conformance / E2E driver"

[[bin]]
name = "agentdeck"
path = "src/main.rs"

[dependencies]
agentdeck-crypto = { path = "../agentdeck-crypto" }
agentdeck-protocol = { path = "../agentdeck-protocol" }
agentdeck-relay-client = { path = "../agentdeck-relay-client" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "process", "sync", "macros", "time"] }
rand = "0.8"
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
libc = "0.2"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = { version = "0.8", features = ["mac_os_10_8_features"] }
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = "2.17"

[dev-dependencies]
agentdeck-relay = { path = "../agentdeck-relay", features = ["server", "tls"] }
rcgen = "0.13"
tempfile = "3"
