[package]
name = "agentdeck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentDeck unified CLI — reference client and contract conformance / E2E driver"

[[bin]]
name = "agentdeck"
path = "src/main.rs"

[dependencies]
agentdeck-protocol = { path = "../agentdeck-protocol" }
agentdeck-relay = { path = "../agentdeck-relay" }
agentdeck-relay-client = { path = "../agentdeck-relay-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "process", "sync", "macros", "time"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
thiserror = "1"
