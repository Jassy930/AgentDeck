[package]
name = "agentdeckd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentDeck daemon — agent-neutral adapter boundary, owns the Codex app-server child process"

[lib]
name = "agentdeckd"
path = "src/lib.rs"

[[bin]]
name = "agentdeckd"
path = "src/main.rs"
required-features = ["daemon-bin"]

[features]
daemon-bin = []

[dependencies]
agentdeck-protocol = { path = "../agentdeck-protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
