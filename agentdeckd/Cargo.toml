[package]
name = "agentdeckd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentDeck daemon — agent-neutral adapter boundary, owns the Codex app-server child process"

[lib]
name = "agentdeckd"
path = "src/lib.rs"

[[bin]]
name = "agentdeckd"
path = "src/main.rs"

[dependencies]
agentdeck-crypto = { path = "../agentdeck-crypto" }
agentdeck-protocol = { path = "../agentdeck-protocol" }
agentdeck-relay-client = { path = "../agentdeck-relay-client" }
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
hmac = "0.12"
libc = "0.2"
rand_chacha = "0.10"
rusqlite = { version = "0.32", features = ["blob", "bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "time", "test-util", "io-std", "signal", "net"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
# Used by claude_code adapter preflight (spec § 5.8 cc-not-installed
# check). Kept as a runtime dep — also re-exported for tests via the
# same crate version (no dev-dep duplication needed).
which = "6"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = "2.17"

[dev-dependencies]
agentdeck-cli = { path = "../agentdeck-cli" }
agentdeck-relay = { path = "../agentdeck-relay", features = ["server", "tls"] }
criterion = { version = "0.5", features = ["html_reports"] }
rcgen = "0.13"
tempfile = "3"
which = "6"

[[bench]]
name = "cc_streaming_throughput"
harness = false

[[bench]]
name = "concurrent_sessions"
harness = false

[[bench]]
name = "history_load_5k"
harness = false
