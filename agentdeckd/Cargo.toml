[package]
name = "agentdeckd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentDeck daemon — agent-neutral adapter boundary, owns the Codex app-server child process"

[lib]
name = "agentdeckd"
path = "src/lib.rs"

[[bin]]
name = "agentdeckd"
path = "src/main.rs"

[dependencies]
agentdeck-protocol = { path = "../agentdeck-protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "time", "io-std", "signal"] }
uuid = { version = "1", features = ["v4"] }
# Used by claude_code adapter preflight (spec § 5.8 cc-not-installed
# check). Kept as a runtime dep — also re-exported for tests via the
# same crate version (no dev-dep duplication needed).
which = "6"

[dev-dependencies]
which = "6"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cc_streaming_throughput"
harness = false

[[bench]]
name = "concurrent_sessions"
harness = false

[[bench]]
name = "history_load_5k"
harness = false
